<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сброс LocalStorage</title>
  <style>
    body {
      background-color: #2b2b2b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 20px;
    }

    p {
      color: #ccc;
      margin-bottom: 30px;
    }

    button {
      background-color: #FFD700;
      border: none;
      color: black;
      padding: 15px 35px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #2b2b2b;
      color: white;
      border: 1px solid #FFD700;
    }
  </style>
</head>
<body>
  <h1>Сброс данных сайта</h1>
  <p>Нажми кнопку, чтобы очистить сохранённые данные (LocalStorage).</p>
  <button onclick="resetStorage()">Сбросить</button>

  <script>
    function resetStorage() {
      localStorage.clear();
      alert('LocalStorage успешно очищен!');
    }
  </script>
</body>
</html>
