<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Евент — GgmoRoom</title>
  <style>
    body {
      margin: 0;
      background-color: #2b2b2b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    /* Кнопка Назад в левом верхнем углу */
    .back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: #FFD700;
      color: black;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .back-button:hover {
      background-color: #2b2b2b;
      color: white;
      border: 1px solid #FFD700;
    }

    h1 {
      font-size: 60px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    p {
      font-size: 18px;
      color: #ccc;
      margin-bottom: 40px;
      max-width: 700px;
    }

    button.participate {
      background-color: #FFD700;
      color: black;
      border: none;
      padding: 15px 40px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button.participate:hover {
      background-color: #2b2b2b;
      color: white;
      border: 1px solid #FFD700;
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="goBack()">Назад</button>

  <h1>Евент</h1>
  <p>
   Евентов не проходит. Но есть небольшие новости! Я уже готовлю самую настоящуу КОРОЛЕВСКУЮ БИТВУ
    МЕЖДУ ЮТКЮЕРАМИ. Ещё неизвесно когда она будет :)
  </p>
  <button class="participate" id="participateBtn">Участвовать</button>

  <script>
    document.getElementById('participateBtn').onclick = function() {
      // Ссылка на Google Форму
      window.open('https://forms.gle/3MMLWDeWTpJwPBiE9', '_blank');
    }

    function goBack() {
      window.open('site1.html', '_blank'); // открывает главную страницу
      window.close(); // закрывает текущую вкладку
    }
  </script>
</body>
</html>
