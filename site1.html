<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GgmoRoom — Главная</title>
  <style>
    body {
      margin: 0;
      background-color: #2b2b2b;
      font-family: Arial, sans-serif;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Верхний левый угол */
    .logo {
      font-weight: bold;
      font-size: 20px;
      margin: 10px 0 0 20px;
    }

    /* Центр страницы */
    .center-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      font-weight: bold;
      text-align: center;
    }

    /* Кнопки под приветствием */
    .buttons {
      margin-top: 30px;
      display: flex;
      flex-direction: column; /* кнопки в столбик */
      gap: 15px;
      align-items: center;
    }

    .buttons button {
      background-color: #FFD700; /* жёлтые */
      color: black;
      border: none;
      padding: 15px 50px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .buttons button:hover {
      background-color: #2b2b2b; /* серые как фон */
      color: white;
      border: 1px solid #FFD700;
    }
  </style>
</head>
<body>
  <div class="logo">GgmoRoom</div>

  <div class="center-text">
    <div id="welcomeText">Привет!</div>
    <div class="buttons">
      <button onclick="openAndClose('social.html')">Соц. сети</button>
      <button onclick="openAndClose('sponsor.html')">Спонсировать</button>
      <button onclick="openAndClose('siteinfo.html')">Про сайт</button>
      <button onclick="openAndClose('event.html')">Участвовать в ивенте</button>
    </div>
  </div>

  <script>
    const username = localStorage.getItem('username');

    if (username) {
      document.getElementById('welcomeText').textContent = `Привет, ${username}`;
    } else {
      // Если имени нет, возвращаем на регистрацию
      window.open('regornot.html', '_blank');
      window.close();
    }

    // Функция открытия нового файла и закрытия текущей вкладки
    function openAndClose(url) {
      window.open(url, '_blank'); // открывает новый файл
      window.close(); // закрывает текущую вкладку
    }
  </script>
</body>
</html>
